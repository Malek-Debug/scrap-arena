<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%2306090d'/%3E%3Cpath d='M14 38h16l4-12h16' fill='none' stroke='%23ff6a00' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M20 48h24' stroke='%2300ff88' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E" />
  <title>SCRAP ARENA: THE FRACTURE</title>
  <!--
    YouTube Playables SDK — load only for YouTube contexts or explicit
    ?ytgame=1 testing. Itch partially exposes the SDK and can break if we load
    it there.
  -->
  <script>
    try {
      const params = new URLSearchParams(location.search);
      const referrer = document.referrer || "";
      let youtubeContext = /(^|\.)youtube\.com$/i.test(location.hostname);
      if (!youtubeContext && referrer) {
        try { youtubeContext = /(^|\.)youtube\.com$/i.test(new URL(referrer).hostname); } catch { /* bad referrer URL */ }
      }
      if ((youtubeContext || params.has("ytgame")) && !params.has("no-ytgame")) {
        document.write('<script src="https://www.youtube.com/game_api/v1" referrerpolicy="no-referrer"><\/script>');
      }
    } catch { /* sandboxed iframe — skip YT SDK */ }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000000; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    #game-container { width: 100%; height: 100%; }
    canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
    #err-overlay { display:none; position:fixed; bottom:0; left:0; right:0; max-height:160px; background:rgba(0,0,0,0.82); color:#ff4444; font:11px monospace; padding:8px 12px; z-index:99999; white-space:pre-wrap; overflow:auto; pointer-events:none; }
    /* Wallet overlay panel */
    #wallet-panel {
      position: fixed; bottom: 0; right: 0;
      background: rgba(8,4,18,0.92); border: 1px solid #ff5500;
      border-top-left-radius: 8px; padding: 8px 14px;
      font-family: "Courier New", monospace; font-size: 12px;
      color: #ff8800; z-index: 9999; display: none; pointer-events: auto;
      max-width: 280px; word-break: break-all;
    }
    #wallet-panel.visible { display: block; }
    #wallet-panel .w-addr { color: #00ff88; font-size: 11px; margin-top: 4px; }
    #wallet-panel .w-sig  { color: #446622; font-size: 10px; margin-top: 2px; word-break: break-all; }
  </style>
</head>
<body>
  <div id="err-overlay"></div>
  <div id="game-container"></div>
  <!-- Wallet notification panel (injected by WalletManager) -->
  <div id="wallet-panel"></div>
  <script>
    window.addEventListener('error', function(e) {
      var o = document.getElementById('err-overlay');
      if (o) { o.style.display = 'block'; o.textContent += 'ERROR: ' + e.message + '\n  at ' + e.filename + ':' + e.lineno + '\n'; }
    });
    window.addEventListener('unhandledrejection', function(e) {
      var o = document.getElementById('err-overlay');
      if (o) { o.style.display = 'block'; o.textContent += 'UNHANDLED PROMISE: ' + e.reason + '\n'; }
    });
    // Fallback: if nothing renders within 8s, show diagnostic
    setTimeout(function() {
      var c = document.querySelector('canvas');
      if (!c) {
        var o = document.getElementById('err-overlay');
        if (o) { o.style.display = 'block'; o.textContent += 'TIMEOUT: Game failed to initialize. Check browser console.\n'; }
      }
    }, 8000);
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
